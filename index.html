<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>贪吃蛇 · 霓虹版 NEON SNAKE</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐍</text></svg>">
<style>
:root{
  --bg:#0a0e1a;
  --bg2:#0e1424;
  --panel:#121a2e;
  --panel2:#0d1526;
  --line:#1c2a47;
  --cyan:#00e5ff;
  --green:#00ff9d;
  --pink:#ff2e97;
  --orange:#ff9f43;
  --txt:#e8f1ff;
  --dim:#7c8db5;
  --danger:#ff4757;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  background:radial-gradient(1200px 800px at 50% -10%,#16224a 0%,var(--bg) 55%,#05070f 100%);
  color:var(--txt);
  overflow:hidden;
  user-select:none;
}
/* 背景网格与光晕 */
.bg-grid{
  position:fixed;inset:0;pointer-events:none;
  background-image:linear-gradient(rgba(0,229,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(0,229,255,.045) 1px,transparent 1px);
  background-size:42px 42px;
  mask-image:radial-gradient(ellipse at center,black 30%,transparent 75%);
}
.glow{
  position:fixed;border-radius:50%;filter:blur(90px);opacity:.35;pointer-events:none;
}
.glow-a{width:420px;height:420px;background:#00e5ff;top:-140px;left:-120px;animation:drift 14s ease-in-out infinite}
.glow-b{width:380px;height:380px;background:#ff2e97;bottom:-160px;right:-120px;animation:drift 18s ease-in-out infinite reverse}
@keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(50px,30px)}}
/* 布局 */
.wrap{
  position:relative;height:100%;display:flex;flex-direction:column;
  max-width:620px;margin:0 auto;padding:14px 14px 10px;
}
header{display:flex;align-items:center;justify-content:space-between;padding:4px 4px 12px}
.logo{display:flex;align-items:center;gap:10px}
.logo .icon{
  width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:24px;
  background:linear-gradient(135deg,var(--cyan),var(--green));
  box-shadow:0 0 22px rgba(0,229,255,.45),0 0 46px rgba(0,255,157,.2);
}
.logo h1{font-size:19px;letter-spacing:2px;font-weight:800}
.logo h1 em{font-style:normal;background:linear-gradient(90deg,var(--cyan),var(--green));-webkit-background-clip:text;background-clip:text;color:transparent}
.logo small{display:block;font-size:10px;color:var(--dim);letter-spacing:3px;margin-top:2px}
.stats{display:flex;gap:8px}
.stat{
  background:var(--panel);border:1px solid var(--line);border-radius:10px;
  padding:6px 12px;text-align:center;min-width:66px;
}
.stat b{display:block;font-size:17px;color:var(--cyan);font-variant-numeric:tabular-nums}
.stat span{font-size:10px;color:var(--dim);letter-spacing:1px}
.stat.best b{color:var(--green)}
/* 主舞台 */
.stage{
  flex:1;display:flex;align-items:center;justify-content:center;min-height:0;position:relative;
}
.board-wrap{
  position:relative;width:100%;aspect-ratio:1/1;max-height:100%;
  border-radius:18px;overflow:hidden;
  background:var(--bg2);
  border:1px solid var(--line);
  box-shadow:0 0 40px rgba(0,229,255,.08),inset 0 0 60px rgba(0,0,0,.55);
}
canvas{display:block;width:100%;height:100%}
/* 浮层 */
.overlay{
  position:absolute;inset:0;background:rgba(6,10,22,.78);
  backdrop-filter:blur(6px);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:14px;z-index:5;
  transition:opacity .3s;
}
.overlay.hidden{opacity:0;pointer-events:none}
.overlay h2{font-size:30px;letter-spacing:4px;font-weight:900}
.overlay h2 em{font-style:normal;color:var(--green);text-shadow:0 0 24px rgba(0,255,157,.8)}
.overlay .sub{color:var(--dim);font-size:13px;letter-spacing:1px;text-align:center;line-height:1.8}
.overlay .score-big{font-size:44px;font-weight:900;color:var(--cyan);text-shadow:0 0 30px rgba(0,229,255,.7);font-variant-numeric:tabular-nums}
.overlay .score-big small{font-size:13px;color:var(--dim);display:block;letter-spacing:2px;margin-bottom:2px}
.btn{
  font-family:inherit;font-size:15px;font-weight:700;letter-spacing:2px;color:#04121a;
  background:linear-gradient(135deg,var(--cyan),var(--green));
  border:none;border-radius:12px;padding:12px 34px;cursor:pointer;
  box-shadow:0 0 24px rgba(0,229,255,.4);transition:transform .15s,box-shadow .15s;
}
.btn:active{transform:scale(.95)}
.btn.ghost{background:var(--panel);color:var(--txt);border:1px solid var(--line);box-shadow:none}
.row{display:flex;gap:10px}
.kbd-hint{color:var(--dim);font-size:11px;letter-spacing:1px}
/* 控制区 */
.controls{padding:12px 2px 2px;display:flex;flex-direction:column;gap:10px}
.dpad{
  display:none;grid-template-columns:repeat(3,1fr);gap:8px;max-width:250px;margin:0 auto;width:100%;
}
.dpad button{
  height:56px;border-radius:12px;border:1px solid var(--line);background:var(--panel);
  color:var(--cyan);font-size:20px;cursor:pointer;font-family:inherit;
  box-shadow:0 4px 0 rgba(0,0,0,.4);transition:transform .1s;
}
.dpad button:active{transform:translateY(3px);box-shadow:none}
.dpad button.up{grid-column:2}
.dpad button.left{grid-column:1;grid-row:2}
.dpad button.down{grid-column:2;grid-row:2}
.dpad button.right{grid-column:3;grid-row:2}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px}
.bar .hint{color:var(--dim);font-size:11px;letter-spacing:1px}
.bar .tools{display:flex;gap:8px}
.mini-btn{
  font-family:inherit;font-size:12px;letter-spacing:1px;color:var(--txt);
  background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:8px 16px;cursor:pointer;
  min-height:44px;display:inline-flex;align-items:center;justify-content:center;
}
.mini-btn:active{transform:scale(.95)}
.mini-btn.on{color:var(--cyan);border-color:var(--cyan);box-shadow:0 0 12px rgba(0,229,255,.3)}
/* 移动端显示方向键 */
@media (pointer:coarse),(max-width:560px){
  .dpad{display:grid}
  .bar .hint{display:none}
  header .logo h1{font-size:16px}
}
@media (min-width:561px){
  .stage{padding:0 6px}
}
</style>
</head>
<body>
<div class="bg-grid"></div>
<div class="glow glow-a"></div>
<div class="glow glow-b"></div>

<div class="wrap">
  <header>
    <div class="logo">
      <div class="icon">🐍</div>
      <div>
        <h1>贪吃蛇 <em>霓虹版</em></h1>
        <small>NEON SNAKE · 2026</small>
      </div>
    </div>
    <div class="stats">
      <div class="stat"><b id="score">0</b><span>得分</span></div>
      <div class="stat best"><b id="best">0</b><span>最高</span></div>
      <div class="stat"><b id="speed">1</b><span>速度</span></div>
    </div>
  </header>

  <div class="stage">
    <div class="board-wrap">
      <canvas id="game" width="480" height="480"></canvas>
      <div class="overlay" id="overlay">
        <h2 id="ov-title">NEON <em>SNAKE</em></h2>
        <div class="sub" id="ov-sub">方向键 / WASD / 滑动屏幕控制<br>吃到发光食物，别撞墙和自己</div>
        <div class="score-big" id="ov-score" style="display:none"><small>本局得分</small><span id="ov-score-num">0</span></div>
        <button class="btn" id="start-btn">开始游戏</button>
        <div class="kbd-hint">↑ ↓ ← → · WASD · 滑动</div>
      </div>
    </div>
  </div>

  <div class="controls">
    <div class="dpad" id="dpad">
      <button class="up" data-dir="up">▲</button>
      <button class="left" data-dir="left">◀</button>
      <button class="down" data-dir="down">▼</button>
      <button class="right" data-dir="right">▶</button>
    </div>
    <div class="bar">
      <span class="hint">↑↓←→ 移动 · P 暂停 · 空格 加速</span>
      <div class="tools">
        <button class="mini-btn" id="pause-btn">暂停</button>
        <button class="mini-btn" id="restart-btn">重开</button>
        <button class="mini-btn" id="sound-btn">音效 开</button>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
'use strict';
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const DPR = Math.min(window.devicePixelRatio||1,2);
const SIZE = 480;
const GRID = 20;
const CELL = SIZE/GRID;

/* ---- 状态 ---- */
let snake, dir, dirQueue, food, score, best, speed, alive, paused, started;
let particles = [], popups = [];
let tickTimer = null, rafId = null;
let lastFrame = 0, acc = 0, moveInterval = 150;
let soundOn = localStorage.getItem('neon_snake_sound') !== '0';

best = parseInt(localStorage.getItem('neon_snake_best')||'0',10)||0;
document.getElementById('best').textContent = best;

/* ---- 音效（Web Audio 合成） ---- */
let actx = null;
function ac(){ if(!actx){ try{ actx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return actx; }
function tone(freq,dur,type,vol,slide){
  if(!soundOn) return;
  const a = ac(); if(!a) return;
  const o = a.createOscillator(), g = a.createGain();
  o.type = type||'square'; o.frequency.value = freq;
  if(slide) o.frequency.exponentialRampToValueAtTime(slide, a.currentTime+dur);
  g.gain.setValueAtTime(vol||.06, a.currentTime);
  g.gain.exponentialRampToValueAtTime(.0001, a.currentTime+dur);
  o.connect(g); g.connect(a.destination);
  o.start(); o.stop(a.currentTime+dur+.02);
}
const sndEat = ()=>{ tone(520,.09,'square',.07); setTimeout(()=>tone(780,.12,'square',.06),70); };
const sndDie = ()=>{ tone(220,.35,'sawtooth',.09,70); setTimeout(()=>tone(110,.4,'sawtooth',.08,55),180); };
const sndTurn = ()=>{ tone(300,.03,'triangle',.04); };
const sndStart = ()=>{ [330,440,660].forEach((f,i)=>setTimeout(()=>tone(f,.1,'triangle',.07),i*90)); };

/* ---- 游戏逻辑 ---- */
function reset(){
  snake = [{x:9,y:10},{x:8,y:10},{x:7,y:10},{x:6,y:10}];
  dir = {x:1,y:0}; dirQueue = [];
  score = 0; speed = 1; moveInterval = 150;
  particles = []; popups = [];
  spawnFood();
  updateHUD();
}
function spawnFood(){
  const free = [];
  for(let y=0;y<GRID;y++) for(let x=0;x<GRID;x++)
    if(!snake.some(s=>s.x===x&&s.y===y)) free.push({x,y});
  if(!free.length) return win();
  const f = free[Math.floor(Math.random()*free.length)];
  food = {x:f.x,y:f.y,life:1};
}
function win(){
  alive = false; clearInterval(tickTimer);
  showOverlay('YOU WIN!','恭喜通关 100% 地图', true);
  saveBest();
}
function saveBest(){
  if(score>best){ best=score; localStorage.setItem('neon_snake_best',String(best)); document.getElementById('best').textContent=best; }
}
function start(){
  ac() && ac().resume && ac().resume().catch(()=>{});
  reset();
  alive = true; paused = false; started = true;
  document.getElementById('pause-btn').textContent='暂停';
  hideOverlay(); sndStart();
  if(tickTimer) clearInterval(tickTimer);
  tickTimer = setInterval(tick, moveInterval);
  rafId = requestAnimationFrame(loop);
}
function tick(){
  if(!alive||paused) return;
  // 处理方向队列
  while(dirQueue.length){
    const nd = dirQueue.shift();
    if(nd.x !== -dir.x || nd.y !== -dir.y){ dir = nd; break; }
  }
  const head = {x:snake[0].x+dir.x, y:snake[0].y+dir.y};
  const wrap = document.getElementById('dpad').offsetParent !== null; // 触屏端无边界包裹
  if(head.x<0||head.y<0||head.x>=GRID||head.y>=GRID){ die(); return; }
  const hitSelf = snake.some(s=>s.x===head.x&&s.y===head.y);
  if(hitSelf){ die(); return; }
  snake.unshift(head);
  if(head.x===food.x&&head.y===food.y){
    score += 10; sndEat();
    burst(head.x,head.y);
    popups.push({x:head.x,y:head.y,t:1,text:'+10'});
    // 加速
    if(score%50===0&&speed<12){ speed++; moveInterval = Math.max(70, 150 - speed*7); clearInterval(tickTimer); tickTimer = setInterval(tick,moveInterval); }
    spawnFood();
  }else{
    snake.pop();
  }
  updateHUD();
}
function die(){
  alive = false; clearInterval(tickTimer);
  sndDie(); saveBest();
  showOverlay('GAME OVER','蛇蛇撞到了…', true);
}
/* ---- 渲染 ---- */
function loop(ts){
  rafId = requestAnimationFrame(loop);
  draw();
}
function draw(){
  ctx.clearRect(0,0,SIZE,SIZE);
  // 棋盘网格
  ctx.strokeStyle = 'rgba(28,42,71,.6)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  for(let i=1;i<GRID;i++){
    ctx.moveTo(i*CELL+.5,0); ctx.lineTo(i*CELL+.5,SIZE);
    ctx.moveTo(0,i*CELL+.5); ctx.lineTo(SIZE,i*CELL+.5);
  }
  ctx.stroke();
  // 食物（脉动发光）
  if(food){
    const pulse = 1+Math.sin(Date.now()/160)*.15;
    const fx = food.x*CELL+CELL/2, fy = food.y*CELL+CELL/2;
    const r = CELL*.38*pulse;
    const grd = ctx.createRadialGradient(fx,fy,0,fx,fy,r*2.4);
    grd.addColorStop(0,'rgba(255,159,67,.85)'); grd.addColorStop(.5,'rgba(255,120,60,.35)'); grd.addColorStop(1,'rgba(255,120,60,0)');
    ctx.fillStyle = grd; ctx.beginPath(); ctx.arc(fx,fy,r*2.4,0,7); ctx.fill();
    ctx.fillStyle = '#ffab66';
    ctx.shadowColor = '#ff9f43'; ctx.shadowBlur = 18;
    ctx.beginPath(); ctx.arc(fx,fy,r,0,7); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(255,255,255,.75)';
    ctx.beginPath(); ctx.arc(fx-r*.32,fy-r*.32,r*.28,0,7); ctx.fill();
  }
  // 蛇身
  for(let i=snake.length-1;i>=0;i--){
    const s = snake[i];
    const x = s.x*CELL, y = s.y*CELL;
    const t = i/snake.length;
    const hue = 165 + t*30; // 青绿渐变
    const isHead = i===0;
    if(isHead){
      ctx.shadowColor = '#00ff9d'; ctx.shadowBlur = 22;
      ctx.fillStyle = '#00ffb3';
    }else{
      ctx.shadowColor = 'rgba(0,229,255,.5)'; ctx.shadowBlur = 10;
      ctx.fillStyle = `hsl(${hue},95%,${isHead?58:42+ (1-t)*22}%)`;
    }
    roundRect(ctx, x+2, y+2, CELL-4, CELL-4, 6);
    ctx.fill();
    ctx.shadowBlur = 0;
    // 鳞片高光
    if(!isHead){
      ctx.fillStyle = 'rgba(255,255,255,.08)';
      roundRect(ctx, x+CELL*.3, y+CELL*.28, CELL*.4, CELL*.14, 2); ctx.fill();
    }
  }
  // 蛇眼
  const head = snake[0];
  if(head){
    const hx = head.x*CELL+CELL/2, hy = head.y*CELL+CELL/2;
    const ex = dir.y!==0?0:dir.x*3.2, ey = dir.x!==0?0:dir.y*3.2;
    const px = -dir.y*3.4, py = dir.x*3.4;
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(hx+ex+px*.6, hy+ey+py*.6, 3.1, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(hx+ex-px*.6, hy+ey-py*.6, 3.1, 0, 7); ctx.fill();
    ctx.fillStyle = '#0a0e1a';
    ctx.beginPath(); ctx.arc(hx+ex+px*.6+dir.x*.9, hy+ey+py*.6+dir.y*.9, 1.5, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(hx+ex-px*.6+dir.x*.9, hy+ey-py*.6+dir.y*.9, 1.5, 0, 7); ctx.fill();
  }
  // 粒子
  particles = particles.filter(p=>p.life>0);
  particles.forEach(p=>{
    p.x+=p.vx; p.y+=p.vy; p.life-=.04; p.vy+=.06;
    ctx.fillStyle = `rgba(0,255,157,${Math.max(0,p.life)})`;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r*p.life+1,0,7); ctx.fill();
  });
  // 得分飘字
  popups = popups.filter(p=>p.t>0);
  popups.forEach(p=>{
    p.t-=.03; p.y-=1;
    ctx.fillStyle = `rgba(255,255,255,${Math.max(0,p.t)})`;
    ctx.font = 'bold 20px system-ui'; ctx.textAlign='center';
    ctx.fillText(p.text, p.x*CELL+CELL/2, p.y*CELL-6);
  });
}
function roundRect(c,x,y,w,h,r){
  c.beginPath();
  c.moveTo(x+r,y); c.lineTo(x+w-r,y); c.quadraticCurveTo(x+w,y,x+w,y+r);
  c.lineTo(x+w,y+h-r); c.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  c.lineTo(x+r,y+h); c.quadraticCurveTo(x,y+h,x,y+h-r);
  c.lineTo(x,y+r); c.quadraticCurveTo(x,y,x+r,y);
  c.closePath();
}
function burst(cx,cy){
  for(let i=0;i<16;i++){
    const a = Math.random()*Math.PI*2, v = 1+Math.random()*3;
    particles.push({x:cx*CELL+CELL/2, y:cy*CELL+CELL/2, vx:Math.cos(a)*v, vy:Math.sin(a)*v-1, life:1, r:2+Math.random()*2.5});
  }
}
/* ---- UI ---- */
const overlay = document.getElementById('overlay');
const ovTitle = document.getElementById('ov-title');
const ovSub = document.getElementById('ov-sub');
const ovScore = document.getElementById('ov-score');
function showOverlay(title,sub,showScore){
  ovTitle.innerHTML = title.replace(' ',' <em>') + (title.includes(' ')?'</em>':'');
  ovSub.innerHTML = sub;
  ovScore.style.display = showScore?'block':'none';
  if(showScore) document.getElementById('ov-score-num').textContent = score;
  overlay.classList.remove('hidden');
}
function hideOverlay(){ overlay.classList.add('hidden'); }
function updateHUD(){
  document.getElementById('score').textContent = score;
  document.getElementById('speed').textContent = speed;
}
document.getElementById('start-btn').addEventListener('click', start);
document.getElementById('restart-btn').addEventListener('click', ()=>{
  if(started) reset(); start();
});
document.getElementById('pause-btn').addEventListener('click', ()=>{
  if(!started||!alive) return;
  paused = !paused;
  document.getElementById('pause-btn').textContent = paused?'继续':'暂停';
});
document.getElementById('sound-btn').addEventListener('click', function(){
  soundOn = !soundOn;
  localStorage.setItem('neon_snake_sound', soundOn?'1':'0');
  this.textContent = '音效 ' + (soundOn?'开':'关');
  this.classList.toggle('on', !soundOn);
});
/* 键盘 */
const keyMap = {ArrowUp:[0,-1],KeyW:[0,-1],ArrowDown:[0,1],KeyS:[0,1],ArrowLeft:[-1,0],KeyA:[-1,0],ArrowRight:[1,0],KeyD:[1,0]};
document.addEventListener('keydown', e=>{
  if(e.code in keyMap){
    e.preventDefault();
    if(!started) return;
    if(!alive){ return; }
    const [dx,dy] = keyMap[e.code];
    const nd = {x:dx,y:dy};
    const last = dirQueue.length?dirQueue[dirQueue.length-1]:dir;
    if((nd.x!==-last.x||nd.y!==-last.y)&&(nd.x!==last.x||nd.y!==last.y)) dirQueue.push(nd);
    if(dirQueue.length>3) dirQueue.shift();
  }else if(e.code==='Space'){
    e.preventDefault(); if(started&&alive){ /* 加速 */
      if(tickTimer){ clearInterval(tickTimer); moveInterval = Math.max(40, moveInterval-60); tickTimer = setInterval(tick,moveInterval); }
    }
  }else if(e.code==='KeyP'){
    document.getElementById('pause-btn').click();
  }
});
/* 触屏方向键 */
document.querySelectorAll('#dpad button').forEach(b=>{
  b.addEventListener('click', ()=>{
    if(!started) return;
    const d = b.dataset.dir;
    const map = {up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};
    const nd = {x:map[d][0],y:map[d][1]};
    const last = dirQueue.length?dirQueue[dirQueue.length-1]:dir;
    if((nd.x!==-last.x||nd.y!==-last.y)&&(nd.x!==last.x||nd.y!==last.y)) dirQueue.push(nd);
  });
});
/* 触屏滑动 */
let touchX=0,touchY=0;
const boardWrap = document.querySelector('.board-wrap');
boardWrap.addEventListener('touchstart', e=>{
  const t = e.touches[0]; touchX = t.clientX; touchY = t.clientY;
},{passive:true});
boardWrap.addEventListener('touchmove', e=>{
  e.preventDefault();
  const t = e.touches[0];
  const dx = t.clientX-touchX, dy = t.clientY-touchY;
  if(Math.abs(dx)<18&&Math.abs(dy)<18) return;
  const nd = Math.abs(dx)>Math.abs(dy)? {x:dx>0?1:-1,y:0} : {x:0,y:dy>0?1:-1};
  const last = dirQueue.length?dirQueue[dirQueue.length-1]:dir;
  if((nd.x!==-last.x||nd.y!==-last.y)&&(nd.x!==last.x||nd.y!==last.y)){ dirQueue.push(nd); if(dirQueue.length>3) dirQueue.shift(); }
  touchX = t.clientX; touchY = t.clientY;
},{passive:false});
/* 初始化界面 */
reset();
showOverlay('NEON SNAKE','方向键 / WASD / 滑动屏幕控制<br>吃到发光食物，别撞墙和自己', false);
})();
